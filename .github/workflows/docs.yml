name: Build & Deploy Docs

on: [workflow_dispatch]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          
      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci

      # Berkeley Mono is licensed and git-ignored in this repo; it is injected
      # from the private fonts repo at deploy time (EULA permits Web Font Use only)
      - name: Fetch licensed font
        uses: actions/checkout@v6
        with:
          repository: Hawxy/fonts
          token: ${{ secrets.FONT_REPO_TOKEN }}
          path: font-assets

      - name: Install font
        run: |
          mkdir -p docs/.vitepress/theme/fonts
          cp "font-assets/Berkeley Mono Variable.woff2" "docs/.vitepress/theme/fonts/"

      - name: Build docs
        run: |
          npm run docs:build
          touch docs/.vitepress/dist/.nojekyll
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist
          
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5